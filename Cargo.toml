[package]
name = "rustdsp"
version = "0.3.5"
edition = "2021"


[dependencies]
cordic = "0.1.5"
num = "0.4.3"
num-complex = "0.4.6"
fixed = "1.28.0"
anyhow = "1.0.95"
tokio = { version = "1.43.0", features = ["sync"] }
async-trait = "0.1.85"

vulkano = { version = "0.35.1", optional = true }

[dev-dependencies]
criterion = { version = "0.5" }
tokio = { version = "1.43.0", features = ["full"] }

[features]
default = []
gpu = ["vulkano"]


[[bench]]
name = "bench_main"
harness = false
