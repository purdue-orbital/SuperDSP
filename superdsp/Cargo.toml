[package]
name = "superdsp"
version = "0.3.5"
edition = "2024"

[lib]

[dependencies]
cordic = "0.1.5"
num = "0.4.3"
num-complex = "0.4.6"
fixed = "1.28.0"
anyhow = "1.0.95"
tokio = { version = "1.43.0", features = ["sync"] }

vulkano = { version = "0.35.1", optional = true }
vulkano-shaders = { version = "0.35.0", optional = true }
bytemuck = "1.21.0"

superdsp-macros = { path = "../superdsp-macros" }

[dev-dependencies]
criterion = { version = "0.5" }
tokio = { version = "1.43.0", features = ["full"] }

[features]
default = []
gpu = ["vulkano", "vulkano-shaders"]


[[bench]]
name = "bench_main"
harness = false
